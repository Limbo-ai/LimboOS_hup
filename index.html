<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limbo Hub</title>
  <!-- Lucide Icons Library -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --primary: #00f3ff;
      --secondary: #ff0055;
      --bg-base: #08090c;
      --card-bg: rgba(16, 20, 28, 0.75);
      --card-border: rgba(0, 243, 255, 0.3);
      --glow-mult: 1;
      --radius: 16px;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Base Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas Dynamic Glow & Color Background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, var(--secondary) -100%, var(--bg-base) 90%);
      transition: background 0.3s ease;
    }

    /* Hub Container */
    .hub-wrapper {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 1100px;
      padding: 2.5rem;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6),
                  0 0 calc(30px * var(--glow-mult)) var(--secondary);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header Section */
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      color: var(--primary);
      filter: drop-shadow(0 0 calc(8px * var(--glow-mult)) var(--primary));
    }

    .brand h1 {
      font-size: 1.6rem;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .brand h1 span {
      color: var(--primary);
      text-shadow: 0 0 calc(10px * var(--glow-mult)) var(--primary);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.6rem;
      border-radius: calc(var(--radius) / 2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 calc(12px * var(--glow-mult)) var(--primary);
    }

    /* Grid Layout */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.5rem;
    }

    .hub-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.75rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: calc(var(--radius) / 1.3);
      text-decoration: none;
      color: #fff;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .hub-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--primary);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4),
                  0 0 calc(20px * var(--glow-mult)) var(--primary);
    }

    .card-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      color: var(--primary);
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }

    .hub-card:hover .card-icon {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 calc(15px * var(--glow-mult)) var(--primary);
    }

    .card-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
    }

    .card-sub {
      font-size: 0.78rem;
      color: #8a8d93;
    }

    /* === SPEZIELLE BUTTON ANIMATIONEN === */

    /* 1. System Monitor Pulse Animation */
    .hub-card[data-module="monitor"].animating {
      animation: monitorPulse 0.8s infinite alternate ease-in-out;
      border-color: var(--primary);
    }
    @keyframes monitorPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 5px var(--primary);
      }
      100% {
        transform: scale(1.05);
        box-shadow: 0 0 25px var(--primary);
      }
    }

    /* 2. Web Terminal Glitch Shake Animation */
    .hub-card[data-module="terminal"].animating {
      animation: terminalGlitch 0.2s infinite;
      border-color: #39ff14;
    }
    @keyframes terminalGlitch {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 2px); }
      50% { transform: translate(3px, -1px); }
      75% { transform: translate(-2px, -2px); }
      100% { transform: translate(2px, 1px); }
    }

    /* 3. Security Center Alarm Flash Animation */
    .hub-card[data-module="security"].animating {
      animation: securityFlash 0.5s infinite alternate;
      border-color: #ff0055;
    }
    @keyframes securityFlash {
      0% {
        background: rgba(255, 0, 85, 0.05);
        box-shadow: 0 0 5px #ff0055;
      }
      100% {
        background: rgba(255, 0, 85, 0.3);
        box-shadow: 0 0 35px #ff0055;
      }
    }

    /* Customizer Drawer Panel */
    .drawer {
      position: fixed;
      top: 0;
      right: -380px;
      width: 340px;
      height: 100vh;
      background: rgba(8, 10, 14, 0.95);
      backdrop-filter: blur(25px);
      border-left: 1px solid var(--card-border);
      z-index: 10;
      padding: 1.5rem;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.7);
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
    }

    .drawer-header h2 {
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
    }

    .control-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .control-group label {
      font-size: 0.85rem;
      color: #b3b3b3;
    }

    .control-group select,
    .control-group input[type="color"],
    .control-group input[type="range"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.6rem;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .control-group input[type="color"] {
      height: 42px;
      padding: 0.2rem;
    }

    /* Fullscreen Code Terminal Overlay */
    #code-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(3, 5, 8, 0.96);
      backdrop-filter: blur(10px);
      z-index: 99;
      display: none;
      flex-direction: column;
      padding: 2rem;
      font-family: 'Courier New', Courier, monospace;
      color: var(--primary);
      overflow: hidden;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
    }

    #code-overlay.active {
      display: flex;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--primary);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #log-stream {
      flex: 1;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-shadow: 0 0 5px var(--primary);
    }

    .log-line {
      opacity: 0.95;
    }
    .log-success { color: #39ff14; text-shadow: 0 0 5px #39ff14; }
    .log-warn { color: #fcee0a; text-shadow: 0 0 5px #fcee0a; }
    .log-danger { color: #ff0055; text-shadow: 0 0 5px #ff0055; }
    .log-info { color: var(--primary); }

    /* Layout Theme Styles */
    body.cyber-style {
      --radius: 0px;
      --font-family: 'Courier New', Courier, monospace;
    }

    body.iron-style {
      --radius: 4px;
      --card-bg: rgba(25, 28, 34, 0.9);
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Main Hub -->
  <main class="hub-wrapper">
    <header class="hub-header">
      <div class="brand">
        <i data-lucide="terminal" class="brand-icon"></i>
        <h1>LIMBO <span>HUB</span></h1>
      </div>
      <button id="open-settings-btn" class="icon-btn" aria-label="Einstellungen öffnen">
        <i data-lucide="sliders"></i>
      </button>
    </header>

    <section class="icon-grid">
      <!-- Active Links -->
      <a href="https://euphonious-rugelach-ae4fe7.netlify.app/" target="_blank" rel="noopener noreferrer" class="hub-card">
        <div class="card-icon"><i data-lucide="download"></i></div>
        <div class="card-title">Limbo OS Download</div>
        <div class="card-sub">Webseite & System Release</div>
      </a>

      <a href="https://github.com/Limbo-ai" target="_blank" rel="noopener noreferrer" class="hub-card">
        <div class="card-icon"><i data-lucide="git-branch"></i></div>
        <div class="card-title">Git / GitHub</div>
        <div class="card-sub">@Limbo-ai Repositories</div>
      </a>

      <a href="https://wiki.archlinux.org/" target="_blank" rel="noopener noreferrer" class="hub-card">
        <div class="card-icon"><i data-lucide="book-open"></i></div>
        <div class="card-title">Arch Wiki</div>
        <div class="card-sub">Dokumentation & Knowledge</div>
      </a>

      <!-- Dynamic Cards -->
      <div class="hub-card dummy-card" data-module="monitor">
        <div class="card-icon"><i data-lucide="cpu"></i></div>
        <div class="card-title">System Monitor</div>
        <div class="card-sub">Kernel & Hardware Telemetrie</div>
      </div>

      <div class="hub-card dummy-card" data-module="terminal">
        <div class="card-icon"><i data-lucide="terminal"></i></div>
        <div class="card-title">Web Terminal</div>
        <div class="card-sub">Liquid Quantum CLI</div>
      </div>

      <div class="hub-card dummy-card" data-module="security">
        <div class="card-icon"><i data-lucide="shield-check"></i></div>
        <div class="card-title">Security Center</div>
        <div class="card-sub">Firewall & Encryption</div>
      </div>
    </section>
  </main>

  <!-- Customizer Drawer Panel -->
  <aside id="settings-drawer" class="drawer">
    <div class="drawer-header">
      <h2><i data-lucide="settings"></i> Customizer</h2>
      <button id="close-settings-btn" class="icon-btn" aria-label="Einstellungen schließen">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="drawer-content">
      <div class="control-group">
        <label for="theme-preset">Theme Presets</label>
        <select id="theme-preset">
          <option value="quantum">Quantum (Cyan / Neon Pink)</option>
          <option value="cyberpunk">Cyberpunk (Neon Yellow / Cyan)</option>
          <option value="toxic">Toxic Arch (Acid Green / Purple)</option>
          <option value="inferno">Inferno (Fire Red / Orange)</option>
          <option value="oled">Pure OLED (Monochrome)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="primary-color">Primärfarbe (Neon Accent)</label>
        <input type="color" id="primary-color" value="#00f3ff">
      </div>

      <div class="control-group">
        <label for="secondary-color">Sekundärfarbe (Hintergrund / Glow)</label>
        <input type="color" id="secondary-color" value="#ff0055">
      </div>

      <div class="control-group">
        <label for="layout-style">Layout Style</label>
        <select id="layout-style">
          <option value="organic">Organic Glass (Curved)</option>
          <option value="cyber">Hard Cyberpunk (Sharp)</option>
          <option value="iron">Industrial Iron (Flat)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="glow-intensity">Glow-Intensität: <span id="glow-val">100%</span></label>
        <input type="range" id="glow-intensity" min="0" max="250" value="100">
      </div>
    </div>
  </aside>

  <!-- Realtime Terminal Stream Overlay -->
  <div id="code-overlay">
    <div class="log-header">
      <span id="log-title">INITIALIZING STREAM...</span>
      <span>SCHLIESST IN: <span id="log-timer">5</span>s</span>
    </div>
    <div id="log-stream"></div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Lucide Icons
      lucide.createIcons();

      // Web Audio API Sound Generator
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
      }

      function playSound(type) {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'open') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'type') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(800 + Math.random() * 400, now);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'close') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      }

      // Settings Drawer Elements
      const drawer = document.getElementById('settings-drawer');
      const openBtn = document.getElementById('open-settings-btn');
      const closeBtn = document.getElementById('close-settings-btn');

      openBtn.addEventListener('click', () => {
        playSound('open');
        drawer.classList.add('open');
      });

      closeBtn.addEventListener('click', () => {
        playSound('close');
        drawer.classList.remove('open');
      });

      // Customizer Logic & Color Engine Fixes
      const primaryInput = document.getElementById('primary-color');
      const secondaryInput = document.getElementById('secondary-color');
      const glowInput = document.getElementById('glow-intensity');
      const glowValDisplay = document.getElementById('glow-val');
      const layoutSelect = document.getElementById('layout-style');
      const themePresetSelect = document.getElementById('theme-preset');
      const canvasContainer = document.getElementById('canvas-container');

      function updateBackground(secColor) {
        document.documentElement.style.setProperty('--secondary', secColor);
        canvasContainer.style.background = `radial-gradient(circle at 50% 50%, ${secColor} -80%, var(--bg-base) 85%)`;
      }

      primaryInput.addEventListener('input', (e) => {
        document.documentElement.style.setProperty('--primary', e.target.value);
        document.documentElement.style.setProperty('--card-border', e.target.value + '44');
      });

      secondaryInput.addEventListener('input', (e) => {
        updateBackground(e.target.value);
      });

      glowInput.addEventListener('input', (e) => {
        const mult = e.target.value / 100;
        document.documentElement.style.setProperty('--glow-mult', mult);
        glowValDisplay.textContent = `${e.target.value}%`;
      });

      layoutSelect.addEventListener('change', (e) => {
        document.body.classList.remove('cyber-style', 'iron-style');
        if (e.target.value === 'cyber') document.body.classList.add('cyber-style');
        if (e.target.value === 'iron') document.body.classList.add('iron-style');
        playSound('open');
      });

      const presets = {
        quantum: { primary: '#00f3ff', secondary: '#ff0055' },
        cyberpunk: { primary: '#fcee0a', secondary: '#00f0ff' },
        toxic: { primary: '#39ff14', secondary: '#b026ff' },
        inferno: { primary: '#ff3300', secondary: '#ff9900' },
        oled: { primary: '#ffffff', secondary: '#222222' }
      };

      themePresetSelect.addEventListener('change', (e) => {
        const selected = presets[e.target.value];
        if (selected) {
          primaryInput.value = selected.primary;
          secondaryInput.value = selected.secondary;
          document.documentElement.style.setProperty('--primary', selected.primary);
          updateBackground(selected.secondary);
          document.documentElement.style.setProperty('--card-border', selected.primary + '44');
          playSound('open');
        }
      });

      // Icon Specific Log Streams
      const logData = {
        monitor: {
          title: "SYSTEM MONITOR // TELEMETRY STREAM",
          logs: [
            "[INFO] Querying CPU Architecture: AMD Ryzen 7 5700G (16 Threads)",
            "[OK] Kernel: x86_64 Linux 7.0.10-arch1-1-limbo",
            "[OK] CPU Usage: 4.2% | Freq: 4.65 GHz | Temp: 38.5°C",
            "[INFO] RAM Telemetry: 8420MiB / 32100MiB (26% Allocated)",
            "[OK] GPU Attachment: NVIDIA GeForce GTX 1650 (Driver: 550.54.14)",
            "[INFO] VRAM Usage: 1120MiB / 4096MiB | Fan Speed: 0%",
            "[OK] NVMe Sensor /dev/nvme0n1: 31°C - Health: 99% GOOD",
            "[INFO] Process Count: 184 Tasks | Threads: 612",
            "[OK] Swap Space: 0MiB / 8192MiB used"
          ]
        },
        terminal: {
          title: "WEB TERMINAL // LIQUID QUANTUM CLI",
          logs: [
            "[INIT] Spawning zsh interactive shell environment...",
            "[OK] User authenticated: limbo@arch-workspace (TTY1)",
            "[INFO] Running: sudo pacman -Syu --noconfirm",
            ":: Synchronizing package databases...",
            "[OK] core is up to date",
            "[OK] extra is up to date",
            "[OK] multilib is up to date",
            ":: Starting full system upgrade...",
            "[OK] System fully upgraded."
          ]
        },
        security: {
          title: "SECURITY CENTER // FIREWALL & CRYPTO ENCLAVE",
          logs: [
            "[SECURITY] Initiating System Audit (Subsystem Shield v4)",
            "[OK] Firewalld Status: Active (Default zone: Drop)",
            "[INFO] Checking open ports... [PORT 22 (SSH): Encrypted Pipe]",
            "[OK] Fail2ban Daemon Active: 0 IPs banned in last 24h",
            "[SECURITY] Generating Ephemeral Session Keys [AES-256-GCM]...",
            "[WARN] Detected 3 failed login attempts from 192.168.1.104",
            "[SECURITY] IP Address 192.168.1.104 quarantined for 3600s",
            "[OK] SHA-512 Root Certificate Validation: PASSED"
          ]
        }
      };

      // Dummy Cards Click Engine
      const dummyCards = document.querySelectorAll('.dummy-card');
      const overlay = document.getElementById('code-overlay');
      const logStream = document.getElementById('log-stream');
      const logTitle = document.getElementById('log-title');
      const logTimer = document.getElementById('log-timer');

      dummyCards.forEach(card => {
        card.addEventListener('click', () => {
          const modType = card.getAttribute('data-module');
          const modConfig = logData[modType] || logData['monitor'];

          playSound('open');
          logTitle.textContent = modConfig.title;
          logStream.innerHTML = '';
          
          // Trigger CSS Button Animation
          card.classList.add('animating');
          overlay.classList.add('active');

          let secondsLeft = 5;
          logTimer.textContent = secondsLeft;

          // Timer Countdown
          const countdownInterval = setInterval(() => {
            secondsLeft--;
            logTimer.textContent = secondsLeft;
            if (secondsLeft <= 0) {
              clearInterval(countdownInterval);
              clearInterval(streamInterval);
              playSound('close');
              card.classList.remove('animating');
              overlay.classList.remove('active');
            }
          }, 1000);

          // Fast Code Spitting Loop
          const streamInterval = setInterval(() => {
            const randomLine = modConfig.logs[Math.floor(Math.random() * modConfig.logs.length)];
            const timestamp = (performance.now() / 1000).toFixed(4);
            const lineElem = document.createElement('div');
            lineElem.className = 'log-line';

            if (randomLine.includes('[OK]')) lineElem.classList.add('log-success');
            else if (randomLine.includes('[WARN]')) lineElem.classList.add('log-warn');
            else if (randomLine.includes('[SECURITY]')) lineElem.classList.add('log-danger');
            else lineElem.classList.add('log-info');

            lineElem.textContent = `[${timestamp}] ${randomLine}`;
            logStream.appendChild(lineElem);
            playSound('type');

            if (logStream.children.length > 22) {
              logStream.removeChild(logStream.firstChild);
            }
          }, 90);
        });
      });
    });
  </script>
</body>
</html>
